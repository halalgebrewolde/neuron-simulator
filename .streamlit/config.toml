[theme]
base = "light"
primaryColor = "#17449E"
backgroundColor = "#E1C17F"
secondaryBackgroundColor = "#EBD39E"
textColor = "#28222A"
font = "sans serif"
codeFont = "monospace"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
